name: Build Apps (Cloud Compile)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node dependencies
        run: npm install

      - name: Build Frontend Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item index.html dist/index.html
          Copy-Item style.css dist/style.css
          Copy-Item app.js dist/app.js
          Copy-Item mockData.js dist/mockData.js
          Copy-Item jszip.min.js dist/jszip.min.js
          Copy-Item -Recurse -Force Images dist/Images

      - name: Build Tauri App (.exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          tagName: v1.0.1-build${{ github.run_number }}
          releaseName: 'Honey Journal v1.0.1 (Build ${{ github.run_number }})'
          releaseDraft: false
          prerelease: false

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;25.2.9519653"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Node dependencies
        run: npm install

      - name: Build Frontend Assets
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp style.css dist/style.css
          cp app.js dist/app.js
          cp mockData.js dist/mockData.js
          cp jszip.min.js dist/jszip.min.js
          cp -r Images dist/Images || true

      - name: Initialize Android mobile scaffolding
        run: |
          CI=true npx tauri android init

      - name: Inject Android Manage External Storage Permission
        run: |
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" \/>' "$MANIFEST_PATH"
            echo "Injected MANAGE_EXTERNAL_STORAGE permission successfully."
          else
            echo "Error: AndroidManifest.xml not found at $MANIFEST_PATH"
            exit 1
          fi

      - name: Build Android App (.apk)
        run: |
          npx tauri android build --apk --debug

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-build${{ github.run_number }}
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
