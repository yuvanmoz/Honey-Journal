[[permission]]
identifier = "allow-custom-fs-commands"
description = "Allows all custom filesystem and folder helper commands in lib.rs"

[permission.commands]
allow = [
  "select_folder",
  "check_storage_permission",
  "request_storage_permission",
  "fs_write_text_file",
  "fs_read_text_file",
  "fs_remove_file",
  "fs_create_dir",
  "fs_read_dir_json"
]
