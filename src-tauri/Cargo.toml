[package]
name = "honey-journal"
version = "1.0.1"
description = "Private, offline-first trading journal focusing on chart setups"
authors = ["Antigravity"]
edition = "2021"
rust-version = "1.60"

[lib]
name = "honey_journal"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[profile.dev]
opt-level = "z"
debug = 0
strip = true
